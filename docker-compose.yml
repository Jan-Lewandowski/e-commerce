name: jl-ecommerce

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: jl-ecommerce-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    image: jl-ecommerce-frontend
    container_name: jl-ecommerce-frontend
    expose:
      - "3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
    image: jl-ecommerce-auth-service
    container_name: jl-ecommerce-auth-service
    expose:
      - "4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  product-service:
    build:
      context: ./services/product-service
    image: jl-ecommerce-product-service
    container_name: jl-ecommerce-product-service
    expose:
      - "3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/products
      AUTH_INTERNAL_URL: http://auth-service:4000
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  review-service:
    build:
      context: ./services/review-service
    image: jl-ecommerce-review-service
    container_name: jl-ecommerce-review-service
    expose:
      - "3003"
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://ecommerce:ecommerce@mongo:27017/reviews?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: jl-ecommerce-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecommerce
      MONGO_INITDB_ROOT_PASSWORD: ecommerce
    expose:
      - "27017"
    ports:
      - "27017:27017"
    volumes:
      - jl-ecommerce-mongodata:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet -u ecommerce -p ecommerce --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: jl-ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: products
    ports:
      - "5432:5432"
    volumes:
      - jl-ecommerce-pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init-auth-db.sql:/docker-entrypoint-initdb.d/01-auth-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ecommerce -d products" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  jl-ecommerce-pgdata:
  jl-ecommerce-mongodata:
