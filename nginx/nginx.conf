events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream auth_upstream {
    server auth-service:4000;
  }

  upstream product_upstream {
    server product-service:3002;
  }

  upstream review_upstream {
    server review-service:3003;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/auth/ {
      proxy_pass http://auth_upstream;
    }

    location /api/users/ {
      proxy_pass http://auth_upstream;
    }

    location ~ ^/api/(products|categories|cart|favorites|orders|admin/orders|suppliers|promotions)(/|$) {
      proxy_pass http://product_upstream;
    }

    location ~ ^/api/(reviews|analytics)(/|$) {
      proxy_pass http://review_upstream;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }
  }
}
